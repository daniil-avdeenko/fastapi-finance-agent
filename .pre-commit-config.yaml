default_stages: [pre-commit]

exclude: |
  (?x)^(
    \.venv/|
    venv/|
    \.idea/|
    \.pytest_cache/|
    \.mypy_cache/|
    \.ruff_cache/|
    __pycache__/|
    migrations/|
    \.env$|
    \.env\..*|
    credentials\.json
  )

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.0
    hooks:
      - id: mypy
        additional_dependencies:
          - pydantic>=2.9
          - pydantic-settings>=2.6
          - fastapi>=0.115
          - sqlalchemy>=2.0
          - aiogram>=3.13
          - httpx>=0.27
          - openai>=1.50
          - langgraph>=1.0
          - prometheus-client>=0.20
        args: [ --ignore-missing-imports ]
        files: ^app/
        exclude: ^migrations/

  - repo: https://gitcode.com/openlibing-test/gitleaks-hooks
    rev: c61eac420c41e18b1175b00eafec26343c010def
    hooks:
      - id: gitleaks

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.6.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
