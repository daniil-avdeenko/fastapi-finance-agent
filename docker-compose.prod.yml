services:
  # Production-конфиг для VPS.
  # web (uvicorn) + postgres в изолированной сети.
  services:
    postgres:
      image: postgres:16-alpine
      restart: unless-stopped
      environment:
        POSTGRES_USER: ${POSTGRES_USER}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        POSTGRES_DB: ${POSTGRES_DB}
      volumes:
        - postgres_data:/var/lib/postgresql/data
      mem_limit: 384m
      memswap_limit: 768m
      healthcheck:
        test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
        interval: 10s
        timeout: 5s
        retries: 5
      networks: [ backend ]

    web:
      build: .
      image: finance-agent:latest
      restart: unless-stopped
      env_file: .env.prod
      ports:
        - "127.0.0.1:8000:8000"
      depends_on:
        postgres:
          condition: service_healthy
      mem_limit: 320m
      networks: [ backend ]

  networks:
    backend:
      driver: bridge

  volumes:
    postgres_data:
      driver: local
