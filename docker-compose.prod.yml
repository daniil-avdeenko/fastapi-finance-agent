# Production-конфиг для VPS.
# web (uvicorn) + postgres в изолированной сети.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    mem_limit: 384m
    memswap_limit: 768m
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [ backend ]

  web:
    build: .
    image: finance-agent:latest
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 320m
    extra_hosts:
      - "projectfin.com.ru:host-gateway"
      - "www.projectfin.com.ru:host-gateway"
    # python -c вместо curl — в базовом образе python:3.12-slim curl отсутствует,
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks: [ backend ]

networks:
  backend:
    driver: bridge

volumes:
  postgres_data:
    driver: local
